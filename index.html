<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Своя Игра</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Своя Игра</h1>

<button id="newGame">Новая игра</button>

<div id="gameBoard"></div>
<div id="players"></div>

<div id="questionScreen" class="hidden">
  <h2 id="questionText"></h2>
  <p id="questionPoints"></p>

  <button id="showAnswer">Показать ответ</button>
  <div id="answer"></div>

  <button id="correct">Ответили правильно</button>
  <button id="wrong">Ответили неправильно</button>
  <button id="back">Назад к таблице</button>
</div>

<script src="script.js"></script>
</body>
</html>
