<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Своя Игра</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Своя Игра</h1>

<button id="newGame">Новая игра</button>

<div id="gameBoard"></div>
<div id="players"></div>

<div id="questionScreen">
  <div id="questionCard">
    <div id="questionText"></div>
    <div id="questionPoints"></div>
    <div id="answer"></div>
    <button id="showAnswer">Показать ответ</button>
    <button id="correct">Верно</button>
    <button id="wrong">Неверно</button>
    <button id="back">Назад</button>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
